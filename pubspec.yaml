name: petnest_saas
description: "PetNest SaaS"
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  url_launcher: ^6.2.5

  # 🌐 綠界付款 WebView
  # 功能：載入 Cloud Function 回傳的付款 HTML，
  # 支援 Android、iOS 與 Web 測試環境。
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

  # 📷 每日照護照片壓縮
  # 功能：產生前台預覽小圖與退房下載版照片，
  # 不保存手機原始超大照片。
  flutter_image_compress: ^2.4.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  cloud_functions: ^6.1.0

  image: ^4.1.7

  # 🔥 Google 登入
  google_sign_in: ^6.2.1

  shared_preferences: ^2.2.2
  share_plus: ^10.0.2
  font_awesome_flutter: ^11.0.0
  path_provider: ^2.1.5

  excel: ^4.0.6
  universal_html: ^2.2.4
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/daily_care/card_backgrounds/