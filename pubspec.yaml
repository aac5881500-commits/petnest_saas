name: petnest_saas
description: "PetNest SaaS"
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  url_launcher: ^6.2.5

  # 🌐 綠界付款 WebView
  # 功能：載入 Cloud Function 回傳的付款 HTML，
  # 支援 Android、iOS 與 Web 測試環境。
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

  # 📷 每日照護照片壓縮
  # 功能：產生前台預覽小圖與退房下載版照片，
  # 不保存手機原始超大照片。
  flutter_image_compress: ^2.4.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  cloud_functions: ^6.1.0

  image: ^4.1.7

  # 🔥 Google 登入
  google_sign_in: ^6.2.1

  shared_preferences: ^2.2.2
  share_plus: ^10.0.2
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.1.0

  excel: ^4.0.6
  universal_html: ^2.2.4
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/daily_care/card_backgrounds/
    - assets/daily_care/illustrations/
    
  # PetNest 免費商用字體庫。店名使用 w800，單一字重檔案要同時登記 400 與 800。
  fonts:
    - family: jfOpenHuninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
          weight: 400
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
          weight: 800

    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC-VariableFont_wght.ttf
          weight: 800

    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifTC-VariableFont_wght.ttf
          weight: 800

    # Klee One 日系手寫楷書
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-Regular.ttf
          weight: 400
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 800

    - family: ChironSungHK
      fonts:
        - asset: assets/fonts/ChironSungHKVF.ttf
          weight: 400
        - asset: assets/fonts/ChironSungHKVF.ttf
          weight: 800