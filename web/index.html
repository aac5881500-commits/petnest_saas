<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
<meta name="google-signin-client_id" content="38879325834-0jhudhp878ic9fpvktclokm8lacpjl62.apps.googleusercontent.com">
<meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PetNest 寵物旅宿管理">
  <meta name="theme-color" content="#FFF8F0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PetNest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PetNest</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #FFF8F0;
    }
    #petnest-startup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF8F0;
      color: #3d342c;
      font-family: sans-serif;
    }
    #petnest-startup .box {
      box-sizing: border-box;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }
    #petnest-startup h1 {
      margin: 0 0 16px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    #petnest-startup .spin {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid #eadfd4;
      border-top-color: #8d6e63;
      border-radius: 50%;
      animation: petnest-spin 0.8s linear infinite;
    }
    #petnest-startup p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #6b5e55;
    }
    #petnest-startup button {
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: #8d6e63;
      color: #fff;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    @keyframes petnest-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #petnest-startup .spin { animation: none; }
    }
  </style>
  <script>
    // 記住瀏覽器的安裝提示，讓 Flutter 在店主點「下載電腦版」時呼叫。
    // 不註冊額外的 Service Worker，避免和 Flutter 產生的更新機制互相覆蓋。
    (function () {
      var deferredPrompt = null;
      var storageKey = 'petnest-pwa-installed';

      function remembered() {
        try {
          return window.localStorage.getItem(storageKey) === '1';
        } catch (error) {
          return false;
        }
      }

      function rememberInstalled() {
        try {
          window.localStorage.setItem(storageKey, '1');
        } catch (error) {}
      }

      function forgetInstalled() {
        try {
          window.localStorage.removeItem(storageKey);
        } catch (error) {}
      }

      function notify(name) {
        window.dispatchEvent(new Event(name));
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        forgetInstalled();
        notify('petnest-pwa-available');
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        rememberInstalled();
        notify('petnest-pwa-installed');
      });

      function browserName() {
        var ua = window.navigator.userAgent || '';
        if (ua.indexOf('Edg/') >= 0) return 'edge';
        if (ua.indexOf('Chrome/') >= 0 || ua.indexOf('CriOS/') >= 0) return 'chrome';
        if (ua.indexOf('Safari/') >= 0) return 'safari';
        if (ua.indexOf('Firefox/') >= 0) return 'firefox';
        return 'other';
      }

      window.petNestPwa = {
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
        },
        canPrompt: function () {
          return deferredPrompt != null;
        },
        rememberedInstalled: remembered,
        isSecure: function () {
          return window.isSecureContext === true;
        },
        browserName: browserName
      };

      window.petNestPwaPrompt = function () {
        if (!deferredPrompt) {
          return Promise.resolve('unavailable');
        }
        var promptEvent = deferredPrompt;
        deferredPrompt = null;
        return promptEvent.prompt().then(function () {
          return promptEvent.userChoice;
        }).then(function (choice) {
          var outcome = choice && choice.outcome ? choice.outcome : 'dismissed';
          if (outcome === 'accepted') {
            rememberInstalled();
          }
          return outcome;
        }).catch(function () {
          return 'dismissed';
        });
      };

      window.petNestPwaListen = function (callback) {
        window.addEventListener('petnest-pwa-available', callback);
        window.addEventListener('petnest-pwa-installed', callback);
      };
    })();
  </script>
</head>
<body>
  <div id="petnest-startup" role="status" aria-live="polite">
    <div class="box">
      <h1>PetNest</h1>
      <div class="spin"></div>
      <p>正在啟動</p>
      <div id="petnest-startup-hint" hidden>
        <p>載入時間較長。可以重新整理，不會清除登入資料。</p>
        <button type="button" onclick="window.location.reload()">重新整理</button>
      </div>
    </div>
  </div>
  <script>
    // Flutter 畫出第一個畫面後移除。Dart 端也會再移除一次，避免遮住已啟動的 App。
    document.addEventListener('flutter-first-frame', function () {
      var root = document.getElementById('petnest-startup');
      if (root && root.parentNode) {
        root.parentNode.removeChild(root);
      }
    });

    window.setTimeout(function () {
      var root = document.getElementById('petnest-startup');
      var hint = document.getElementById('petnest-startup-hint');
      if (!root || !hint) return;
      hint.hidden = false;
      console.info('[PetNestStartup] Flutter bootstrap timeout');
    }, 12000);

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      var message = reason && reason.message ? String(reason.message) : '';
      if (message.indexOf('Database is closing') === -1) return;
      if (window.__petnestPersistenceLogged) return;
      window.__petnestPersistenceLogged = true;
      console.warn('[PetNestStartup] Auth persistence fail reason=database-closing');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
